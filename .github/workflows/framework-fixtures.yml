# Runs the committed framework fixtures.
#
# Until this file existed, every "verified" in the framework work meant *someone ran it once on
# their own machine*. The fixtures were committed and still nobody would have noticed them break.
#
# WHY THIS IS SHAPED THIS WAY — from runtimes measured ON A RUNNER, which is not where I first
# measured them:
#
#                      my laptop      ubuntu-latest (run 30908007369 / 30908192669)
#   vue      verify      255s           20s   (whole job 29s, npm ci 2s)
#   vue      mutate     >600s          261s   (13 mutants + canonical, 0 survivors)
#   astro    verify      146s           48s   (whole job)
#   astro    mutate      ~300s         329s   (9 mutants + canonical, 0 survivors)
#   sveltekit verify      14s           27s   (whole job)
#
# The first column is wrong for this purpose and it is what the original version of this file was
# built on. It was taken on a developer machine with four agents contending for it and cold npm
# installs over a VPN — a plausible number for a person waiting at a terminal, and not a
# measurement of what CI costs. A CI budget measured somewhere that is not CI is not a budget.
#
# On the real numbers the sweeps are cheap, so they run on the SAME path filter as verify: when a
# fixture changes, the thing that proves that fixture can still go red runs with it. The nightly
# schedule stays, because it catches drift the path filter cannot see — a new runner image, a new
# Node minor — on a tree nobody touched.
#
# WHAT THIS DELIBERATELY DOES NOT GATE:
#
# The core vitest suite is NOT wired here. It is intermittently red on main with no changes
# (independently reported by Fizz; different files each run, all timeouts in the 5-8s band).
# Making a flaky suite a required check produces red builds nobody trusts, which is the same
# "reports a result nobody believes" failure this whole effort exists to remove. It needs its
# timeout budget measured first. Named here rather than left as an unexplained absence.
name: framework-fixtures

on:
  push:
    paths:
      - 'scripts/framework-fixtures/**'
      - '.github/workflows/framework-fixtures.yml'
  pull_request:
    paths:
      - 'scripts/framework-fixtures/**'
      - '.github/workflows/framework-fixtures.yml'
  schedule:
    # Catches drift on a tree nobody pushed to — runner image, Node minor. Not a cost dodge.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # Each fixture installs its own EXACTLY pinned toolchain. `npm ci` rather than `npm install`
    # so a transitive dependency cannot drift under a pin the fixture claims is exact.
    name: verify (${{ matrix.fixture }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        fixture: [vue, astro, sveltekit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/framework-fixtures/${{ matrix.fixture }}/package-lock.json

      - name: install pinned toolchain
        working-directory: scripts/framework-fixtures/${{ matrix.fixture }}
        run: npm ci --no-audit --no-fund

      - name: verify
        working-directory: scripts/framework-fixtures/${{ matrix.fixture }}
        run: node verify.mjs

  mutate:
    # The sweep is what proves the fixture can go red at all — the one check that would catch a
    # matcher that cannot fire. On the runner it costs 261s (vue) and 329s (astro), so it runs on
    # every push that touches a fixture, not only nightly. An earlier version of this file ran it
    # nightly-only on the strength of a >600s figure measured on a laptop; see the header.
    name: mutate (${{ matrix.fixture }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        fixture: [vue, astro]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/framework-fixtures/${{ matrix.fixture }}/package-lock.json

      - name: install pinned toolchain
        working-directory: scripts/framework-fixtures/${{ matrix.fixture }}
        run: npm ci --no-audit --no-fund

      - name: mutation sweep
        working-directory: scripts/framework-fixtures/${{ matrix.fixture }}
        # Exits non-zero if any mutant SURVIVES, so "the fixture cannot go red" fails here.
        run: node mutate.mjs
